name: Apply Cobalt web Save patch

on:
  push:
    branches:
      - cobalt-web-save
    paths:
      - .github/workflows/apply-cobalt-web-save.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply source patch
        run: node scripts/run-cobalt-web-save-patch.mjs
      - name: Commit patched website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: integrate Cobalt into FRXE Web Save"
          git push origin HEAD:cobalt-web-save
